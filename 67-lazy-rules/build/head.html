<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why Some Instructions Wait — Post 67 | Visual Summary</title>
<style>
:root{
  --bg:#050811;
  --surface:#0a1020;
  --surface2:#0f1830;
  --border:#1a2a4a;
  --acc:#f97316;
  --acc2:#fb923c;
  --acc3:#fdba74;
  --sky:#38bdf8;
  --sky2:#7dd3fc;
  --text:#e2e8f0;
  --muted:#64748b;
  --dim:#94a3b8;
  --green:#10b981;
  --red:#ef4444;
  --red2:#fca5a5;
  /* the three load triggers */
  --launch:#38bdf8;
  --onread:#f59e0b;
  --oninvoke:#a78bfa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;overflow-x:hidden}
a{color:var(--sky2);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:'Courier New',monospace;font-size:.86em;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:0 .3em;color:var(--acc3)}

/* GATE */
#gate{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center}
.gate-box{background:var(--surface);border:1px solid var(--acc);border-radius:16px;padding:2.5rem;width:min(380px,90vw);text-align:center}
.gate-box h2{font-size:1.4rem;color:var(--acc3);margin-bottom:.5rem}
.gate-box p{color:var(--muted);font-size:.9rem;margin-bottom:1.5rem}
.gate-box input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem;color:var(--text);font-size:1rem;margin-bottom:1rem;outline:none}
.gate-box input:focus{border-color:var(--acc)}
.gate-box button{width:100%;background:linear-gradient(135deg,var(--acc),var(--sky));color:#fff;border:none;border-radius:8px;padding:.75rem;font-size:1rem;cursor:pointer}
.gate-box button:hover{opacity:.9}
#gate-err{color:var(--red);font-size:.85rem;margin-top:.5rem;display:none}

.topbar{position:sticky;top:0;z-index:100;background:rgba(5,8,17,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:.75rem 1.5rem;display:flex;align-items:center;gap:1rem}
.topbar .logo{color:var(--acc3);font-weight:700;font-size:.95rem;white-space:nowrap}
.topbar .post-tag{background:rgba(249,115,22,.16);color:var(--acc3);border:1px solid var(--acc);border-radius:20px;padding:.2rem .75rem;font-size:.8rem;white-space:nowrap}
.topbar nav{display:flex;gap:.4rem;flex-wrap:wrap;flex:1;justify-content:flex-end}
.topbar nav a{color:var(--muted);font-size:.78rem;padding:.25rem .5rem;border-radius:4px;transition:.2s}
.topbar nav a:hover{color:var(--acc2);background:rgba(249,115,22,.1);text-decoration:none}
@media(max-width:760px){ .topbar nav{display:none} }
#progress{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--acc),var(--sky));z-index:200;width:0}

.container{max-width:960px;margin:0 auto;padding:0 1.5rem 5rem}
@media(max-width:600px){ .container{padding:0 1rem 4rem} }

.hero{padding:3.5rem 0 2rem;text-align:center}
.hero .category{display:inline-block;background:rgba(56,189,248,.12);color:var(--sky2);border:1px solid var(--sky);border-radius:20px;padding:.3rem .9rem;font-size:.8rem;margin-bottom:1rem;letter-spacing:.05em;text-transform:uppercase}
.hero h1{font-size:clamp(1.8rem,4vw,2.7rem);font-weight:800;line-height:1.2;margin-bottom:1rem}
.hero h1 span{background:linear-gradient(135deg,var(--acc3),var(--sky));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero .sub{color:var(--muted);font-size:1rem;max-width:700px;margin:0 auto 1.5rem}
.hero .meta{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

.section{margin:2.5rem 0;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.75rem;scroll-margin-top:70px}
@media(max-width:600px){ .section{padding:1.15rem} }
.section h2{font-size:1.2rem;color:var(--acc3);margin-bottom:1rem}
.section p{color:var(--dim);font-size:.93rem}
.section p+p{margin-top:.75rem}
.section h3{font-size:1rem;color:var(--sky2);margin:1.5rem 0 .6rem}
.section ul,.section ol{color:var(--dim);font-size:.93rem;margin:.6rem 0 0 1.1rem}
.section li{margin-bottom:.45rem}
.section em,.section strong{color:var(--text)}

.callout{background:rgba(249,115,22,.07);border-left:3px solid var(--acc);border-radius:8px;padding:1rem 1.25rem;margin:1.15rem 0;font-size:.9rem;color:var(--dim)}
.callout strong{color:var(--acc3)}
.callout.sky{background:rgba(56,189,248,.07);border-color:var(--sky)}
.callout.sky strong{color:var(--sky2)}
.callout.red{background:rgba(239,68,68,.07);border-color:var(--red)}
.callout.red strong{color:var(--red2)}
.quote{border-left:3px solid var(--border);padding:.2rem 0 .2rem 1rem;margin:1rem 0;color:var(--text);font-style:italic;font-size:.92rem}
.quote cite{display:block;font-style:normal;font-size:.75rem;color:var(--muted);margin-top:.3rem}

.panel{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-top:1.25rem}
@media(max-width:600px){ .panel{padding:.85rem} }
.panel-title{font-size:.8rem;color:var(--acc2);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.9rem}
.ctl-row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.9rem}
.ctl-row label{color:var(--muted);font-size:.82rem}
.btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.45rem .9rem;color:var(--dim);font-size:.82rem;cursor:pointer;transition:.18s;font-family:inherit}
.btn:hover{border-color:var(--acc);color:var(--acc3)}
.btn.active{background:rgba(249,115,22,.16);border-color:var(--acc2);color:var(--acc3)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--sky));color:#fff;border-color:transparent;font-weight:600}
.btn.primary:hover{opacity:.9;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:.3rem .6rem;font-size:.75rem}
input[type=range]{accent-color:var(--acc2);flex:1;min-width:120px}
input[type=text]{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.45rem .7rem;color:var(--text);font-size:.88rem;font-family:'Courier New',monospace;outline:none;width:100%}
input[type=text]:focus{border-color:var(--acc)}
.mono{font-family:'Courier New',monospace}
.note{font-size:.8rem;color:var(--muted);margin-top:.6rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:760px){ .grid2{grid-template-columns:1fr} }

/* trigger tags */
.tag-l,.tag-r,.tag-i{display:inline-block;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:20px;padding:.08rem .5rem;border:1px solid;white-space:nowrap;font-family:'Segoe UI',system-ui,sans-serif}
.tag-l{color:var(--launch);border-color:var(--launch);background:rgba(56,189,248,.1)}
.tag-r{color:var(--onread);border-color:var(--onread);background:rgba(245,158,11,.1)}
.tag-i{color:var(--oninvoke);border-color:var(--oninvoke);background:rgba(167,139,250,.1)}

/* ── section 1: flip ── */
.flip{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
@media(max-width:760px){ .flip{grid-template-columns:1fr} }
.fcard{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:1rem;transition:border-color .2s}
.fcard.on{border-color:var(--onread)}
.fcard.launch{border-color:var(--launch)}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.6rem;flex-wrap:wrap}
.fname{font-family:'Courier New',monospace;font-size:.85rem;color:var(--text);font-weight:700}
pre.src{font-family:'Courier New',monospace;font-size:.76rem;line-height:1.5;color:var(--dim);white-space:pre-wrap;word-break:break-word;margin:0}
pre.src .fm{color:var(--onread)}
pre.src .fm.off{color:var(--muted);text-decoration:line-through;opacity:.5}
.fwhen{margin-top:.7rem;font-size:.82rem;color:var(--dim)}
.toggle{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--dim);cursor:pointer;margin-top:.8rem;user-select:none}
.toggle input{accent-color:var(--onread);width:16px;height:16px}

/* ── section 2: simulator ── */
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1rem;margin-top:1rem}
@media(max-width:820px){ .sim{grid-template-columns:1fr} }
.tree{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:.7rem .4rem;font-family:'Courier New',monospace;font-size:.78rem}
.tree .grp{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:.5rem .5rem .2rem;font-family:'Segoe UI',system-ui,sans-serif}
.tnode{display:flex;align-items:center;gap:.45rem;padding:.22rem .5rem;border-radius:6px;cursor:pointer;border:1px solid transparent;white-space:nowrap;overflow:hidden}
.tnode:hover{border-color:var(--border);background:var(--surface)}
.tnode .ind{color:var(--border);flex-shrink:0}
.tnode .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;border:1.5px solid var(--muted)}
.tnode .nm{overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.tnode.dir{cursor:default}
.tnode.dir:hover{border-color:transparent;background:none}
.tnode.dir .nm{color:var(--muted)}
.tnode.ghost .nm{color:var(--muted);font-style:italic;opacity:.6}
.tnode.k-launch .dot{border-color:var(--launch)}
.tnode.k-glob .dot,.tnode.k-nested .dot{border-color:var(--onread)}
.tnode.k-skill .dot{border-color:var(--oninvoke)}
.tnode.k-launch.in .dot{background:var(--launch)}
.tnode.k-glob.in .dot,.tnode.k-nested.in .dot{background:var(--onread)}
.tnode.k-skill.in .dot{background:var(--oninvoke)}
.tnode.k-skill.half .dot{background:linear-gradient(90deg,var(--oninvoke) 50%,transparent 50%)}
.tnode.in .nm{color:var(--text)}
.tnode.src .dot{border-radius:2px;border-color:var(--border)}
.tnode.src.seen .dot{background:var(--dim);border-color:var(--dim)}
.tnode.flash{animation:flash 1s ease}
@keyframes flash{0%{background:rgba(245,158,11,.35)}100%{background:transparent}}
.tnode .act{margin-left:auto;font-size:.6rem;color:var(--muted);font-family:'Segoe UI',system-ui,sans-serif;opacity:0;transition:.15s}
.tnode:hover .act{opacity:1}

.ctx{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:.75rem}
.ctx-head{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;margin-bottom:.5rem;flex-wrap:wrap}
.ctx-head b{font-size:.76rem;color:var(--acc2);text-transform:uppercase;letter-spacing:.05em}
.ctx-head span{font-size:.75rem;color:var(--muted);font-family:'Courier New',monospace}
.meter{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden;display:flex;margin-bottom:.6rem}
.meter i{display:block;height:100%;transition:width .3s}
.ctx-list{display:flex;flex-direction:column;gap:.3rem;min-height:120px}
.centry{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.5rem;align-items:center;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--launch);border-radius:6px;padding:.3rem .5rem;font-size:.74rem;cursor:pointer}
.centry.r-path_glob_match,.centry.r-nested_traversal{border-left-color:var(--onread)}
.centry.r-skill{border-left-color:var(--oninvoke)}
.centry.new{animation:slidein .45s ease}
@keyframes slidein{0%{transform:translateX(16px);opacity:0;background:rgba(245,158,11,.25)}100%{transform:none;opacity:1}}
.centry .cp{font-family:'Courier New',monospace;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.centry .cr{font-size:.62rem;color:var(--muted);font-family:'Courier New',monospace}
.centry .ct{font-family:'Courier New',monospace;color:var(--dim);font-size:.7rem}
.ctx-empty{color:var(--muted);font-size:.8rem;text-align:center;padding:1.5rem 0}

.narr{background:rgba(249,115,22,.06);border:1px solid rgba(249,115,22,.28);border-radius:8px;padding:.7rem .9rem;margin-top:.8rem;font-size:.87rem;color:var(--dim);min-height:3.2em}
.narr b{color:var(--acc3)}
.narr .ev{display:block;font-family:'Courier New',monospace;font-size:.75rem;color:var(--muted);margin-bottom:.25rem}
.narr .ev .p{color:var(--sky2)}
.out{margin-top:.8rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.out .oh{font-size:.7rem;padding:.35rem .7rem;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:.5rem;color:var(--muted);font-family:'Courier New',monospace}
.out.bad{border-color:var(--red)} .out.bad .oh b{color:var(--red2)}
.out.good{border-color:var(--green)} .out.good .oh b{color:#6ee7b7}
.out pre{padding:.6rem .8rem;font-family:'Courier New',monospace;font-size:.74rem;color:var(--dim);white-space:pre-wrap;margin:0}
.out pre .hl{background:rgba(239,68,68,.18);color:var(--red2)}
.out.good pre .hl{background:rgba(16,185,129,.15);color:#6ee7b7}
.steps{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center}
.steps .dotstep{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:.65rem;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:'Courier New',monospace}
.steps .dotstep.done{border-color:var(--acc);color:var(--acc3)}
.steps .dotstep.cur{background:var(--acc);color:#fff;border-color:var(--acc)}
.inspect{margin-top:.8rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.7rem .8rem;display:none}
.inspect.show{display:block}
.inspect .ih{display:flex;justify-content:space-between;gap:.5rem;align-items:center;margin-bottom:.4rem;flex-wrap:wrap}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.72rem;color:var(--muted);margin-top:.6rem;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.3rem;vertical-align:middle}

/* ── section 3: glob ── */
.gfiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:.3rem;margin-top:.8rem}
.gfile{font-family:'Courier New',monospace;font-size:.76rem;padding:.3rem .55rem;border-radius:6px;background:var(--bg);border:1px solid var(--border);color:var(--muted);transition:.15s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gfile.hit{border-color:var(--onread);color:var(--text);background:rgba(245,158,11,.1)}
.gstat{font-size:.82rem;color:var(--dim);margin-top:.6rem}
.gstat b{color:var(--onread);font-family:'Courier New',monospace}
.gerr{color:var(--red2)}

/* ── section 4: budget ── */
.sl{display:grid;grid-template-columns:180px minmax(0,1fr) 70px;gap:.6rem;align-items:center;margin-bottom:.5rem;font-size:.82rem;color:var(--dim)}
.sl .v{font-family:'Courier New',monospace;color:var(--acc3);text-align:right}
@media(max-width:600px){ .sl{grid-template-columns:1fr 64px} .sl input{grid-column:1/3;grid-row:2} }
.bars{margin-top:1rem;display:flex;flex-direction:column;gap:.7rem}
.bar .bl{display:flex;justify-content:space-between;font-size:.78rem;color:var(--dim);margin-bottom:.25rem;gap:.5rem}
.bar .bl b{font-family:'Courier New',monospace;color:var(--text)}
.bar .bw{height:22px;background:var(--bg);border:1px solid var(--border);border-radius:5px;overflow:hidden;display:flex}
.bar .bw i{display:block;height:100%;transition:width .25s}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.6rem;margin-top:1rem}
.rcell{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.6rem .7rem}
.rcell .rk{font-size:.64rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rcell .rv{font-size:1.15rem;font-family:'Courier New',monospace;color:var(--acc3);font-weight:700;margin-top:.15rem}

/* tables */
table.cmp{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:.9rem}
table.cmp th,table.cmp td{border:1px solid var(--border);padding:.5rem .6rem;text-align:left;vertical-align:top}
table.cmp th{background:var(--surface2);color:var(--acc3);font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em}
table.cmp td{color:var(--dim)}
table.cmp td.num{font-family:'Courier New',monospace;color:var(--text);text-align:right;white-space:nowrap}
table.cmp td.bad{color:var(--red2)}
table.cmp td.good{color:#6ee7b7}
.tblwrap{overflow-x:auto}

/* ── section 6: quiz ── */
.quiz{display:flex;flex-direction:column;gap:.7rem;margin-top:1rem}
.q{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:.8rem .9rem}
.q.right{border-color:var(--green)}
.q.wrong{border-color:var(--red)}
.q .qt{font-size:.9rem;color:var(--text);margin-bottom:.55rem}
.q .qopts{display:flex;gap:.35rem;flex-wrap:wrap}
.q .qopts .btn{font-size:.74rem;padding:.3rem .6rem;font-family:'Courier New',monospace}
.q .qopts .btn.pick-right{border-color:var(--green);color:#6ee7b7;background:rgba(16,185,129,.12)}
.q .qopts .btn.pick-wrong{border-color:var(--red);color:var(--red2);background:rgba(239,68,68,.1)}
.q .qa{font-size:.82rem;color:var(--dim);margin-top:.55rem;display:none}
.q .qa.show{display:block}
.qscore{font-size:.85rem;color:var(--dim);margin-top:.8rem}
.qscore b{color:var(--acc3)}

pre.codeblock{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.8rem 1rem;font-family:'Courier New',monospace;font-size:.76rem;color:var(--dim);overflow-x:auto;margin-top:.8rem;line-height:1.5}
pre.codeblock .k{color:var(--sky2)} pre.codeblock .s{color:var(--acc3)} pre.codeblock .c{color:var(--muted)}

/* ladder */
.ladder{display:flex;flex-direction:column;gap:.5rem;margin-top:1rem}
.rung{display:grid;grid-template-columns:150px minmax(0,1fr);gap:.8rem;align-items:start;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:.7rem .9rem}
@media(max-width:600px){ .rung{grid-template-columns:1fr} }
.rung .rw{font-size:.82rem}
.rung .rd{font-size:.84rem;color:var(--dim)}
.rung .rd code{font-size:.78rem}

.related-strip{margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--border)}
.related-strip-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.related-strip-label::after{content:'';flex:1;height:1px;background:var(--border)}
.related-strip-grid{display:flex;gap:12px;flex-wrap:wrap}
.rc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 15px;text-decoration:none;color:inherit;transition:all .15s;min-width:160px;flex:1;max-width:230px}
.rc:hover{border-color:#555;transform:translateY(-1px);text-decoration:none}
.rc-type{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.rc-num{font-size:10px;color:var(--muted);margin-bottom:2px;font-family:'Courier New',monospace}
.rc-title{font-size:12px;font-weight:700;color:var(--text);line-height:1.35;margin-bottom:3px}
.rc-why{font-size:10px;color:var(--muted);line-height:1.5}
.map-link-btn{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:11px;color:#a5b4fc;font-weight:600;border:1px solid rgba(99,102,241,.3);border-radius:6px;padding:5px 12px;transition:all .15s;text-decoration:none}
.map-link-btn:hover{border-color:#6366f1;background:rgba(99,102,241,.08);text-decoration:none}

.footer{text-align:center;color:var(--muted);font-size:.78rem;padding-top:2rem;border-top:1px solid var(--border);margin-top:2rem}
</style>
</head>
<body>
<div id="progress"></div>

<!-- GATE -->
<div id="gate">
  <div class="gate-box">
    <div style="font-size:2rem;margin-bottom:.5rem">📂</div>
    <h2>Visual Summary</h2>
    <p>Post 67 &mdash; Why Some Instructions Wait</p>
    <input type="password" id="gate-input" placeholder="Enter password" onkeydown="if(event.key==='Enter')checkGate()">
    <button onclick="checkGate()">Unlock</button>
    <div id="gate-err">Incorrect password</div>
  </div>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <span class="logo">Visual Summary</span>
  <span class="post-tag">Post #67</span>
  <nav>
    <a href="#s-question">The Question</a>
    <a href="#s-sim">Simulator</a>
    <a href="#s-glob">Patterns</a>
    <a href="#s-budget">Budget</a>
    <a href="#s-why">Why Reads</a>
